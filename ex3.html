<script>
function during_dragdrop(e){
      e.preventDefault();
}
function begin_drag(e){
      e.dataTransfer.setData("text/html",e.target.id);
}
function end_drop(e){
      e.preventDefault();
      var code=e.dataTransfer.getData("text/html");
      var original=document.getElementById(code);
      var copy=original.cloneNode(true);
      copy.id="copy_"+new Date().getTime();
      copy.draggable=true;
      e.target.appendChild(copy);
}
</script>

<div align = "center" ><button onclick="getLocation()">Show Shop Location</button></div>

<script>
function getLocation() {
    if (navigator.geolocation) {
        navigator.geolocation.getCurrentPosition(showPosition, showError);
    } else {
        alert("Geolocation is not supported.");
    }
}

function showPosition(position) {
    let lat = position.coords.latitude;
    let lon = position.coords.longitude;

    // Open Google Maps
    window.open("https://www.google.com/maps?q=" + lat + "," + lon, "_blank");
}

function showError() {
    alert("Unable to retrieve your location.");
}
</script>
